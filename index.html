<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Monitoreo de Planta</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>🌿 Monitoreo de Planta</h1>
    <p>Control de condiciones ambientales</p>
  </header>

  <main class="dashboard">
    <section class="sensor-data">
      <div class="sensor-card">
        <h2>🌡️ Temperatura Ambiente</h2>
        <p id="temp">-- °C</p>
      </div>
      <div class="sensor-card">
        <h2>💧 Humedad Ambiente</h2>
        <p id="humedad">-- %</p>
      </div>
      <div class="sensor-card">
        <h2>🌱 Humedad del Suelo</h2>
        <p id="suelo">-- %</p>
      </div>
      <div class="sensor-card">
        <h2>☀️ Luz Solar</h2>
        <p id="luz">-- lux</p>
      </div>
    </section>

    <section class="foto-planta">
      <h2>📸 Foto de la Planta</h2>
      <input type="file" name="imagenPlanta" id="imagenPlanta" accept="image/*" />
      <br /><br />
      <img id="planta-img" src="https://via.placeholder.com/400x300?text=Planta+Actual" alt="Foto de la planta" />
    </section>
  </main>

  <footer>
    <p>Creado por Bruno Hnchaño • 2025</p>
  </footer>

  <section id="galeria">
    <h2>Galería</h2>
    <div id="imagenesSubidas" style="margin-top: 20px; display:flex; flex-wrap: wrap;"></div>
  </section>

  <!-- Modal para imagen grande -->
  <div id="modalImagen" class="close">
    <img src="" alt="Imagen ampliada" />
  </div>

  <script>
    const API_KEY_IMGBB = "2bd99dc7efd4559f644a56cb82dde35f";

    // 🔹 Configuración de ThingSpeak
    const CHANNEL_ID = "3084210";  // Reemplaza con tu canal
    const READ_API_KEY = "I1119NY1ODMEK0EG";  // Si tu canal es público, podés dejarlo vacío

    async function cargarDatosThingSpeak() {
      try {
        const url = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?results=1&api_key=${READ_API_KEY}`;
        const resp = await fetch(url);
        const data = await resp.json();

        if (data.feeds.length > 0) {
          const feed = data.feeds[0];
          document.getElementById('temp').textContent = `${feed.field1 || "--"} °C`;
          document.getElementById('humedad').textContent = `${feed.field2 || "--"} %`;
          document.getElementById('suelo').textContent = `${feed.field3 || "--"} %`;
          document.getElementById('luz').textContent = `${feed.field4 || "--"} lux`;
        }
      } catch (err) {
        console.error("Error obteniendo datos de ThingSpeak:", err);
      }
    }

    // Actualizar cada 15 segundos
    setInterval(cargarDatosThingSpeak, 5000);
    cargarDatosThingSpeak();

    // 🔹 Subir imagen planta a ImgBB
    document.getElementById('imagenPlanta').addEventListener('change', function() {
      const file = this.files[0];
      if (!file) return alert('Selecciona una imagen');

      const reader = new FileReader();
      reader.onloadend = function() {
        const base64Image = reader.result.split(',')[1];

        fetch(`https://api.imgbb.com/1/upload?key=${API_KEY_IMGBB}`, {
          method: "POST",
          body: new URLSearchParams({ image: base64Image })
        })
        .then(res => res.json())
        .then(data => {
          const url = data.data.url;
          document.getElementById('planta-img').src = url;

          // Agregar a galería
          const galeriaDiv = document.getElementById('imagenesSubidas');
          const img = document.createElement('img');
          img.src = url;
          img.alt = "Imagen galería";
          img.title = "Clic para ampliar";
          img.addEventListener('click', () => abrirModal(url));
          galeriaDiv.appendChild(img);

          alert('Imagen subida correctamente.');
          document.getElementById('imagenPlanta').value = "";
        })
        .catch(err => {
          console.error(err);
          alert('Error al subir imagen');
        });
      };
      reader.readAsDataURL(file);
    });

    // 🔹 Modal imagen
    const modal = document.getElementById('modalImagen');
    const modalImg = modal.querySelector('img');

    function abrirModal(url) {
      modalImg.src = url;
      modal.style.display = 'flex';
    }

    modal.addEventListener('click', (e) => {
      if (e.target === modal || e.target === modalImg) {
        modal.style.display = 'none';
        modalImg.src = '';
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === "Escape" && modal.style.display === 'flex') {
        modal.style.display = 'none';
        modalImg.src = '';
      }
    });
  </script>
</body>
</html>
